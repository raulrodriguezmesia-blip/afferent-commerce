<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 85" width="520" height="85">
  <!-- 1. ISOTIPO (Cuadrado azul con esquinas redondeadas + A + Check) -->
  <g transform="translate(10, 10)">
    <!-- Contenedor Base Azul -->
    <rect width="65" height="65" rx="14" fill="#2563EB" />
    
    <!-- Trazo Blanco de la "A" -->
    <path d="M20 50 L32.5 20 L45 50 M25 39 H40" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          
    <!-- Trazo Teal del "Check" de Validación -->
    <path d="M28 46 L36 53 L51 28" stroke="#14B8A6" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- 2. TITULAR: AfferentCommerce (En blanco puro para Dark Mode) -->
  <text x="92" y="47" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">AfferentCommerce</text>

  <!-- 3. SUBTÍTULO: Autonomous Agentic Commerce Engine -->
  <text x="94" y="66" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, &#39;Helvetica Neue&#39;, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" opacity="0.9" letter-spacing="0.2">autonomous agentic commerce engine</text>
</svg>